    <script>
      // Carousel functionality
      class CarouselManager {
        constructor(name, trackId, totalSlides) {
          this.name = name;
          this.track = document.getElementById(trackId);
          this.totalSlides = totalSlides;
          this.currentIndex = 0;
          this.updateCounter();
        }

        next() {
          this.currentIndex = (this.currentIndex + 1) % this.totalSlides;
          this.updateCarousel();
        }

        prev() {
          this.currentIndex = (this.currentIndex - 1 + this.totalSlides) % this.totalSlides;
          this.updateCarousel();
        }

        updateCarousel() {
          const offset = -this.currentIndex * 100;
          this.track.style.transform = `translateX(${offset}%)`;
          this.updateCounter();
        }

        updateCounter() {
          const counter = document.getElementById(`${this.name}-counter`);
          counter.textContent = `${this.currentIndex + 1} / ${this.totalSlides}`;
        }
      }

      // Initialize carousels
      const briCarousel = new CarouselManager('bri', 'bri-track', 5);
      const jesseCarousel = new CarouselManager('jesse', 'jesse-track', 8);

      // Attach event listeners
      document.querySelectorAll('.carousel-control').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const carousel = e.target.dataset.carousel;
          const direction = e.target.classList.contains('next') ? 'next' : 'prev';
          
          if (carousel === 'bri') {
            briCarousel[direction]();
          } else {
            jesseCarousel[direction]();
          }
        });
      });

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowRight') briCarousel.next(); jesseCarousel.next();
        if (e.key === 'ArrowLeft') briCarousel.prev(); jesseCarousel.prev();
      });
    </script>
